<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>奇门出行诀 · 5环 AR 实景罗盘</title>
<!-- 优先读取同目录离线 lunar.js，失败自动回退 CDN -->
<script src="./lunar.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js';s.onload=function(){window.__onLunarReady&&window.__onLunarReady();};document.head.appendChild(s);"></script>
<style>
  :root {
    --bg: #070b14;
    --panel: rgba(11, 17, 30, 0.82);
    --panel-solid: #0c1322;
    --border: rgba(212, 175, 55, 0.32);
    --gold: #e2be67;
    --gold-dim: rgba(226, 190, 103, 0.55);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --l4: #10b981;
    --l3: #22d3ee;
    --l2: #60a5fa;
    --l1: #84cc16;
    --warn: #f59e0b;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 摄像头底层 */
  #camera-video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; display: none;
    filter: brightness(0.78) contrast(1.05);
  }
  #camera-video.active { display: block; }
  #bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 50% 48%, rgba(28, 45, 78, 0.55) 0%, rgba(7, 11, 20, 0.96) 72%),
      linear-gradient(rgba(226,190,103,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,190,103,0.04) 1px, transparent 1px);
    background-size: 100% 100%, 36px 36px, 36px 36px;
    transition: opacity .3s;
  }
  #bg-grid.ar-on { opacity: 0.25; }

  /* 顶部 HUD */
  .top-hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top, 8px) + 6px) 10px 8px;
    background: linear-gradient(180deg, rgba(7,11,20,0.92) 0%, rgba(7,11,20,0.68) 80%, transparent 100%);
    pointer-events: none;
  }
  .top-hud > * { pointer-events: auto; }
  .hud-header {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .brand-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--gold);
    backdrop-filter: blur(8px);
  }
  .method-seg {
    display: flex; background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; overflow: hidden; backdrop-filter: blur(8px);
  }
  .method-seg button {
    background: none; border: none; color: var(--muted);
    padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: 600;
  }
  .method-seg button.active { background: var(--gold); color: #111827; }

  .meta-bar {
    margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px;
    font-size: 11px; color: #d1d5db;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 5px 9px; backdrop-filter: blur(8px);
  }
  .meta-bar .bazi { color: var(--gold); font-weight: 700; letter-spacing: 0.5px; }
  .meta-bar .tag-bad {
    background: rgba(239,68,68,0.22); border: 1px solid var(--bad);
    color: #fca5a5; padding: 1px 6px; border-radius: 4px; font-weight: 700;
  }

  /* 准星实时朝向卡片 */
  .heading-card {
    margin-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: rgba(10, 16, 28, 0.86); border: 1px solid var(--border);
    border-radius: 12px; padding: 7px 10px; backdrop-filter: blur(10px);
    cursor: pointer;
  }
  .heading-left { display: flex; align-items: baseline; gap: 6px; }
  .heading-deg { font-size: 22px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .heading-dir { font-size: 12px; color: var(--gold); font-weight: 700; }
  .heading-right { text-align: right; font-size: 11px; line-height: 1.35; }
  .level-badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-weight: 700; font-size: 11px; color: #09101c;
  }
  .crack-warn {
    margin-top: 4px; font-size: 11px; color: #fde68a; background: rgba(245,158,11,0.2);
    border: 1px solid rgba(245,158,11,0.6); border-radius: 6px; padding: 3px 8px;
    text-align: center; display: none;
  }
  .crack-warn.show { display: block; }

  /* 罗盘舞台 */
  .compass-stage {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding-top: 108px; padding-bottom: 128px;
    touch-action: none;
  }
  .compass-shell {
    position: relative;
    width: min(94vw, 62vh, 520px);
    height: min(94vw, 62vh, 520px);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.35s ease;
  }
  .compass-shell.tilt-3d {
    transform: perspective(900px) rotateX(28deg) scale(1.03);
  }

  /* 固定准星与天心十道 */
  .lubber-line {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    z-index: 12; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
  }
  .lubber-tri {
    width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 13px solid #ef4444;
    filter: drop-shadow(0 0 6px rgba(239,68,68,0.85));
  }
  .lubber-stem {
    width: 2px; height: 48%; position: absolute; top: 4px; left: 50%;
    transform: translateX(-50%); background: linear-gradient(180deg, rgba(239,68,68,0.85), rgba(239,68,68,0.1));
    pointer-events: none; z-index: 11;
  }
  .crosshair-h {
    position: absolute; left: 4%; right: 4%; top: 50%; height: 1px;
    background: rgba(239,68,68,0.22); pointer-events: none; z-index: 11;
  }

  #compass-svg {
    width: 100%; height: 100%; overflow: visible;
    filter: drop-shadow(0 8px 26px rgba(0,0,0,0.65));
  }
  #wheel-group {
    transform-origin: 500px 500px;
    will-change: transform;
  }
  .palace-hit { cursor: pointer; transition: opacity .15s; }
  .palace-hit:hover { opacity: 0.88; }

  /* 底部工具坞 */
  .bottom-dock {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 6px 10px calc(env(safe-area-inset-bottom, 8px) + 8px);
    background: linear-gradient(0deg, rgba(7,11,20,0.96) 0%, rgba(7,11,20,0.84) 75%, transparent 100%);
  }
  .ring-toggles {
    display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px;
    scrollbar-width: none;
  }
  .ring-toggles::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; background: var(--panel); border: 1px solid rgba(255,255,255,0.16);
    color: var(--muted); border-radius: 999px; padding: 4px 9px; font-size: 11px;
    cursor: pointer; font-weight: 600; backdrop-filter: blur(8px);
  }
  .chip.on {
    border-color: var(--gold); color: var(--gold);
    background: rgba(226, 190, 103, 0.16);
  }

  .sim-bar {
    display: none; align-items: center; gap: 8px; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px 10px; font-size: 11px; color: var(--gold);
  }
  .sim-bar.show { display: flex; }
  .sim-bar input[type=range] { flex: 1; accent-color: var(--gold); }

  .action-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .dock-btn {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.14);
    color: var(--text); border-radius: 10px; padding: 7px 4px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    backdrop-filter: blur(8px);
  }
  .dock-btn.primary {
    background: linear-gradient(135deg, #c4a352, #e2be67);
    color: #0b111e; border-color: #e2be67;
  }
  .dock-btn.active { border-color: var(--l4); color: var(--l4); }
  .dock-btn span.ico { font-size: 14px; line-height: 1; }

  .time-row {
    display: flex; gap: 5px; margin-bottom: 6px;
  }
  .time-row button {
    flex: 1; background: var(--panel); border: 1px solid rgba(255,255,255,0.14);
    color: var(--text); border-radius: 8px; padding: 5px 4px; font-size: 11px;
    cursor: pointer; font-weight: 600;
  }
  .time-row button.now-btn { color: var(--gold); border-color: var(--border); }

  /* 抽屉弹窗 */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.62);
    display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.open { display: flex; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 82vh;
    background: var(--panel-solid); border: 1px solid var(--border);
    border-bottom: none; border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 -10px 35px rgba(0,0,0,0.6);
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sheet-head h3 { margin: 0; font-size: 15px; color: var(--gold); }
  .sheet-close {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; font-size: 14px;
  }
  .sheet-body {
    padding: 12px 16px 24px; overflow-y: auto; font-size: 13px; line-height: 1.6;
  }
  .tab-bar {
    display: flex; gap: 6px; margin-bottom: 12px;
  }
  .tab-btn {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04); color: var(--muted); font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .tab-btn.active { background: var(--gold); color: #0b111e; border-color: var(--gold); }

  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .card.good { border-color: rgba(16,185,129,0.5); background: rgba(16,185,129,0.08); }
  .card.warn { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.07); }
  .card.bad { border-color: rgba(239,68,68,0.45); background: rgba(239,68,68,0.07); }
  .card-title { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 4px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .pill {
    font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,0.08); color: #e5e7eb;
  }
  .pill.g { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
  .pill.b { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
  .pill.y { background: rgba(226,190,103,0.2); color: #fde68a; border: 1px solid rgba(226,190,103,0.45); }

  .form-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .form-row label { font-size: 12px; color: var(--muted); min-width: 58px; }
  .form-row select, .form-row input {
    flex: 1; background: #141d31; color: #fff; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .btn-full {
    width: 100%; padding: 10px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #c4a352, #e2be67); color: #0b111e;
    font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .https-banner {
    display: none; margin-top: 4px; font-size: 11px; color: #fca5a5;
    background: rgba(239,68,68,0.18); border: 1px solid rgba(239,68,68,0.5);
    border-radius: 6px; padding: 3px 8px; text-align: center;
  }
  .https-banner.show { display: block; }
</style>
</head>
<body>

<video id="camera-video" autoplay playsinline muted></video>
<div id="bg-grid"></div>

<!-- 顶部 HUD -->
<div class="top-hud">
  <div class="hud-header">
    <div class="brand-pill">🧭 奇门出行诀 AR</div>
    <div class="method-seg" id="method-seg">
      <button data-m="ChaiBu" class="active">拆补</button>
      <button data-m="ZhiRun">置闰</button>
      <button data-m="YinPan">阴盘</button>
    </div>
  </div>

  <div class="meta-bar" id="meta-bar">
    <span>正在初始化历法引擎...</span>
  </div>

  <div class="heading-card" id="heading-card" onclick="openCurrentPalaceDetail()">
    <div class="heading-left">
      <span class="heading-deg" id="hud-deg">000.0°</span>
      <div>
        <div class="heading-dir" id="hud-dir">正北 · 坎1宫</div>
        <div style="font-size:11px;color:var(--muted)" id="hud-sub">子山 · 子宫</div>
      </div>
    </div>
    <div class="heading-right" id="hud-eval">
      <div>等待排盘...</div>
    </div>
  </div>

  <div class="crack-warn" id="crack-warn">⚠️ 当前接近八卦界线（大空亡缝），出行建议微调避开</div>
  <div class="https-banner" id="https-banner">⚠️ 非 HTTPS 环境，浏览器可能限制相机或磁感罗盘，已自动开放手动模拟</div>
</div>

<!-- 中央 5-Ring 罗盘 -->
<div class="compass-stage" id="compass-stage">
  <div class="compass-shell" id="compass-shell">
    <div class="lubber-line"><div class="lubber-tri"></div></div>
    <div class="lubber-stem"></div>
    <div class="crosshair-h"></div>
    <svg id="compass-svg" viewBox="0 0 1000 1000">
      <defs>
        <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1e293b" stop-opacity="0.92"/>
          <stop offset="100%" stop-color="#090f1d" stop-opacity="0.96"/>
        </radialGradient>
      </defs>
      <g id="wheel-group">
        <g id="ring5-24shan"></g>
        <g id="ring4-12zhi"></g>
        <g id="ring3-geju"></g>
        <g id="ring2-chuxing"></g>
        <g id="ring1-qimen"></g>
        <g id="center-hub"></g>
      </g>
    </svg>
  </div>
</div>

<!-- 底部控制坞 -->
<div class="bottom-dock">
  <div class="sim-bar" id="sim-bar">
    <span>手动旋转</span>
    <input type="range" id="sim-slider" min="0" max="359.5" step="0.5" value="0">
    <span id="sim-val">0°</span>
  </div>

  <div class="ring-toggles" id="ring-toggles">
    <button class="chip on" data-ring="ring1">R1 奇门盘</button>
    <button class="chip on" data-ring="ring2">R2 出行评级</button>
    <button class="chip on" data-ring="ring3">R3 格局/行动</button>
    <button class="chip on" data-ring="ring4">R4 12地支</button>
    <button class="chip on" data-ring="ring5">R5 24山</button>
    <button class="chip" id="btn-label-mode" onclick="toggleLabelMode()">模式: 传统格局</button>
    <button class="chip" id="btn-tilt" onclick="toggleTilt3D()">3D 倾角</button>
  </div>

  <div class="time-row">
    <button onclick="stepHour(-2)">◀ 上时辰</button>
    <button class="now-btn" onclick="resetToNow()">⚡ 当下</button>
    <button onclick="stepHour(2)">下时辰 ▶</button>
    <button onclick="openTimeModal()">📅 自选时间</button>
  </div>

  <div class="action-row">
    <button class="dock-btn" id="btn-camera" onclick="toggleCamera()">
      <span class="ico">📷</span><span>AR相机</span>
    </button>
    <button class="dock-btn" id="btn-sensor" onclick="toggleSensorMode()">
      <span class="ico">🧲</span><span id="sensor-lbl">启磁感</span>
    </button>
    <button class="dock-btn primary" onclick="openChuXingModal()">
      <span class="ico">🧭</span><span>出行诀</span>
    </button>
    <button class="dock-btn" onclick="openSummaryModal()">
      <span class="ico">🌟</span><span>吉格/三胜</span>
    </button>
    <button class="dock-btn" onclick="openCurrentPalaceDetail()">
      <span class="ico">📖</span><span>本宫详批</span>
    </button>
  </div>
</div>

<!-- 通用底部抽屉 -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="modal-title">详情</h3>
      <button class="sheet-close" onclick="closeModal()">✕</button>
    </div>
    <div class="sheet-body" id="modal-body"></div>
  </div>
</div>

<script>
/* ============================================================================
 * 一、空间几何字典（严格对齐 12地支 30° 表 与 24山 15° 表）
 * ============================================================================ */
const PALACE_META = {
  1: { num:1, gua:'坎', dir:'正北', center:0,   elem:'水', zhi:['子'],     shan:['壬','子','癸'], star:'天蓬', door:'休门' },
  8: { num:8, gua:'艮', dir:'东北', center:45,  elem:'土', zhi:['丑','寅'], shan:['丑','艮','寅'], star:'天任', door:'生门' },
  3: { num:3, gua:'震', dir:'正东', center:90,  elem:'木', zhi:['卯'],     shan:['甲','卯','乙'], star:'天冲', door:'伤门' },
  4: { num:4, gua:'巽', dir:'东南', center:135, elem:'木', zhi:['辰','巳'], shan:['辰','巽','巳'], star:'天辅', door:'杜门' },
  9: { num:9, gua:'离', dir:'正南', center:180, elem:'火', zhi:['午'],     shan:['丙','午','丁'], star:'天英', door:'景门' },
  2: { num:2, gua:'坤', dir:'西南', center:225, elem:'土', zhi:['未','申'], shan:['未','坤','申'], star:'天芮', door:'死门' },
  7: { num:7, gua:'兑', dir:'正西', center:270, elem:'金', zhi:['酉'],     shan:['庚','酉','辛'], star:'天柱', door:'惊门' },
  6: { num:6, gua:'乾', dir:'西北', center:315, elem:'金', zhi:['戌','亥'], shan:['戌','乾','亥'], star:'天心', door:'开门' },
  5: { num:5, gua:'中', dir:'中央', center:null,elem:'土', zhi:[],         shan:[],               star:'天禽', door:'死门' }
};
const RING_ORDER = [1, 8, 3, 4, 9, 2, 7, 6]; // 顺时针外八宫

// 12 地支：每支 30°，子中 0° (345°–15°)
const ZHI_12 = [
  { name:'子', center:0,   dir:'正北',   palace:1 },
  { name:'丑', center:30,  dir:'北偏东', palace:8 },
  { name:'寅', center:60,  dir:'东偏北', palace:8 },
  { name:'卯', center:90,  dir:'正东',   palace:3 },
  { name:'辰', center:120, dir:'东偏南', palace:4 },
  { name:'巳', center:150, dir:'南偏东', palace:4 },
  { name:'午', center:180, dir:'正南',   palace:9 },
  { name:'未', center:210, dir:'南偏西', palace:2 },
  { name:'申', center:240, dir:'西偏南', palace:2 },
  { name:'酉', center:270, dir:'正西',   palace:7 },
  { name:'戌', center:300, dir:'西偏北', palace:6 },
  { name:'亥', center:330, dir:'北偏西', palace:6 }
];

// 24 山：每山 15°，子中 0° (352.5°–7.5°)
const SHAN_24 = [
  { name:'子', center:0,   palace:1, type:'zhi' },
  { name:'癸', center:15,  palace:1, type:'gan' },
  { name:'丑', center:30,  palace:8, type:'zhi' },
  { name:'艮', center:45,  palace:8, type:'gua' },
  { name:'寅', center:60,  palace:8, type:'zhi' },
  { name:'甲', center:75,  palace:3, type:'gan' },
  { name:'卯', center:90,  palace:3, type:'zhi' },
  { name:'乙', center:105, palace:3, type:'gan' },
  { name:'辰', center:120, palace:4, type:'zhi' },
  { name:'巽', center:135, palace:4, type:'gua' },
  { name:'巳', center:150, palace:4, type:'zhi' },
  { name:'丙', center:165, palace:9, type:'gan' },
  { name:'午', center:180, palace:9, type:'zhi' },
  { name:'丁', center:195, palace:9, type:'gan' },

/* ============================================================================
 * 三、纯原生时家奇门排盘引擎（依赖 lunar.js）
 * ============================================================================ */
const QimenEngine = {
  // 置闰法：以两年前冬至的最近上元符头起算，精确推演超神/接气/闰芒种/闰大雪
  calcZhiRunJu(solar) {
    // 23:00 换日柱，归入次日早子时
    let baseSolar = solar;
    if (solar.getHour() >= 23) {
      baseSolar = solar.next(1);
    }
    const targetDay = Solar.fromYmd(baseSolar.getYear(), baseSolar.getMonth(), baseSolar.getDay());
    const startYear = targetDay.getYear() - 2;

    // 预取连续4年的24节气表（按时间排序）
    const termList = [];
    for (let y = startYear; y <= targetDay.getYear() + 1; y++) {
      const ly = LunarYear.fromYear(y);
      const jds = ly.getJieQiJulianDays();
      const keys = LunarUtil.JIE_QI_IN_USE;
      for (let i = 1; i <= 24; i++) { // 1=冬至 .. 24=大雪
        const s = Solar.fromJulianDay(jds[i]);
        const name = JQ_ORDER[i - 1];
        termList.push({
          name,
          idx: i - 1,
          solar: Solar.fromYmd(s.getYear(), s.getMonth(), s.getDay())
        });
      }
    }

    // 找到第一个冬至，并定位其对应的上元符头（在 [冬至-8天, 冬至+6天] 内的唯一 15日周期起点）
    const dz0 = termList[0].solar;
    let cycleStart = null;
    for (let d = -8; d <= 6; d++) {
      const cand = dz0.next(d);
      const gz = cand.getLunar().getDayInGanZhi();
      if (LunarUtil.getJiaZiIndex(gz) % 15 === 0) {
        cycleStart = cand;
        break;
      }
    }
    if (!cycleStart) cycleStart = dz0;

    let tIdx = 0;
    let isLeapCycle = false;
    let safety = 0;
    while (safety++ < 150) {
      const nextCycleStart = cycleStart.next(15);
      // targetDay 落在 [cycleStart, nextCycleStart) 内
      if (targetDay.subtract(cycleStart) >= 0 && targetDay.subtract(nextCycleStart) < 0) {
        const daysIn = targetDay.subtract(cycleStart);
        const yuanIdx = Math.min(2, Math.floor(daysIn / 5));
        const term = termList[tIdx];
        const info = JQ_TABLE[term.name];
        return {
          jqName: term.name,
          isLeapTerm: isLeapCycle,
          yuanIdx,
          yuanName: ['上元','中元','下元'][yuanIdx],
          isYang: info.yang,
          juNumber: info.ju[yuanIdx],
          note: isLeapCycle ? `置闰(${term.name}闰)` : '置闰法'
        };
      }
      // 推演下一个15日周期是否置闰
      const curTerm = termList[tIdx];
      const nextTerm = termList[tIdx + 1];
      if (!nextTerm) break;
      if (!isLeapCycle && (curTerm.name === '芒种' || curTerm.name === '大雪')) {
        const chaoShenDays = nextTerm.solar.subtract(nextCycleStart);
        if (chaoShenDays >= 9) {
          // 芒种或大雪超神达9天以上，重复本节气（置闰）
          isLeapCycle = true;
          cycleStart = nextCycleStart;
          continue;
        }
      }
      isLeapCycle = false;
      tIdx++;
      cycleStart = nextCycleStart;
    }
    return this.calcChaiBuJu(solar);
  },

  // 拆补法：精确节气 + 日干支符头定三元
  calcChaiBuJu(solar) {
    const lunar = solar.getLunar();
    const prevJQ = lunar.getPrevJieQi(false);
    const jqName = prevJQ.getName();
    const dayGZ = lunar.getDayInGanZhiExact(); // 23:00 已自动换日
    const dayIdx = LunarUtil.getJiaZiIndex(dayGZ);
    const yuanIdx = Math.floor(dayIdx / 5) % 3;
    const info = JQ_TABLE[jqName] || { yang: true, ju: [1,7,4] };
    return {
      jqName,
      isLeapTerm: false,
      yuanIdx,
      yuanName: ['上元','中元','下元'][yuanIdx],
      isYang: info.yang,
      juNumber: info.ju[yuanIdx],
      note: '拆补法'
    };
  },

  // 阴盘奇门：(年支数 + 农历月 + 农历日 + 时支数) % 9，冬至后阳遁、夏至后阴遁
  calcYinPanJu(solar) {
    const lunar = solar.getLunar();
    const prevJQ = lunar.getPrevJieQi(false);
    const jqName = prevJQ.getName();
    const info = JQ_TABLE[jqName] || { yang: true };
    const yZhiIdx = lunar.getYearZhiIndexExact() + 1; // 子=1..亥=12
    const lMonth = Math.abs(lunar.getMonth());
    const lDay = lunar.getDay();
    const hZhiIdx = lunar.getTimeZhiIndex() + 1;
    let ju = (yZhiIdx + lMonth + lDay + hZhiIdx) % 9;
    if (ju === 0) ju = 9;
    return {
      jqName,
      isLeapTerm: false,
      yuanIdx: -1,
      yuanName: '阴盘数',
      isYang: info.yang,
      juNumber: ju,
      note: '阴盘奇门'
    };
  },

  generate(dateObj, method = 'ChaiBu', wuBuJiMode = 'zhishi') {
    const solar = Solar.fromDate(dateObj);
    const lunar = solar.getLunar();

    const yGan = lunar.getYearGanExact(), yZhi = lunar.getYearZhiExact();
    const mGan = lunar.getMonthGanExact(), mZhi = lunar.getMonthZhiExact();
    const dGan = lunar.getDayGanExact(),   dZhi = lunar.getDayZhiExact();
    const hGan = lunar.getTimeGan(),       hZhi = lunar.getTimeZhi();
    const timeGZ = hGan + hZhi;

    let juInfo;
    if (method === 'ZhiRun') juInfo = this.calcZhiRunJu(solar);
    else if (method === 'YinPan') juInfo = this.calcYinPanJu(solar);
    else juInfo = this.calcChaiBuJu(solar);

    const { isYang, juNumber } = juInfo;

    // 1. 地盘布三奇六仪
    const earthStem = {};
    for (let i = 0; i < 9; i++) {
      const p = isYang
        ? ((juNumber - 1 + i) % 9) + 1
        : ((juNumber - 1 - i + 90) % 9) + 1;
      earthStem[p] = STEM_SEQ[i];
    }

    // 2. 找时柱旬首、值符、值使
    const xunHeadGZ = LunarUtil.getXun(timeGZ);
    const xunShouStem = XUN_HEAD_STEM[xunHeadGZ];
    const xunKongStr = LunarUtil.getXunKong(timeGZ); // 例如 "戌亥"
    const xunKongZhis = [xunKongStr[0], xunKongStr[1]];
    const xunKongPalaces = [...new Set(xunKongZhis.map(z => ZHI_TO_PALACE[z]))];

    const maZhi = MA_XING_ZHI[hZhi];
    const maPalace = ZHI_TO_PALACE[maZhi];

    let xunPalace = 1;
    for (let p = 1; p <= 9; p++) {
      if (earthStem[p] === xunShouStem) { xunPalace = p; break; }
    }

    const zhiFuStar = PALACE_META[xunPalace].star;
    const zhiShiDoor = PALACE_META[xunPalace].door;

    // 3. 天盘旋转（值符随时干）
    const targetTimeStem = (hGan === '甲') ? xunShouStem : hGan;
    let zfTargetPalace = 1;
    for (let p = 1; p <= 9; p++) {
      if (earthStem[p] === targetTimeStem) { zfTargetPalace = p; break; }
    }
    if (zfTargetPalace === 5) zfTargetPalace = 2; // 寄坤二宫

    const zfOrigRingPalace = (xunPalace === 5) ? 2 : xunPalace;
    const zfOrigIdx = RING_ORDER.indexOf(zfOrigRingPalace);
    const zfDstIdx = RING_ORDER.indexOf(zfTargetPalace);

    const palaces = {};
    RING_ORDER.forEach(p => {
      palaces[p] = {
        ...PALACE_META[p],
        earthStem: earthStem[p],
        earthJiStem: p === 2 ? earthStem[5] : '',
        heavenStem: '',
        heavenJiStem: '',
        star: '',
        hasQin: false,
        door: '',
        god: '',
        godShort: '',
        marks: [],
        goodForms: [],
        badForms: [],
        isKong: xunKongPalaces.includes(p),
        isMa: maPalace === p,
        isSanSheng: false,
        isWuBuJi: false,
        eval: null
      };
    });

    for (let i = 0; i < 8; i++) {
      const srcP = RING_ORDER[(zfOrigIdx + i) % 8];
      const dstP = RING_ORDER[(zfDstIdx + i) % 8];
      palaces[dstP].star = PALACE_META[srcP].star;
      palaces[dstP].heavenStem = earthStem[srcP];
      if (srcP === 2) {
        palaces[dstP].heavenJiStem = earthStem[5];
        palaces[dstP].hasQin = true;
      }
    }

    // 4. 八门旋转（值使随时宫）
    const steps = (LunarUtil.getJiaZiIndex(timeGZ) - LunarUtil.getJiaZiIndex(xunHeadGZ) + 60) % 60;
    let zsTargetPalace = isYang
      ? ((xunPalace - 1 + steps) % 9) + 1
      : ((xunPalace - 1 - steps + 90) % 9) + 1;
    if (zsTargetPalace === 5) zsTargetPalace = 2;

    const zsOrigIdx = RING_ORDER.indexOf(zfOrigRingPalace);
    const zsDstIdx = RING_ORDER.indexOf(zsTargetPalace);
    for (let i = 0; i < 8; i++) {
      const srcP = RING_ORDER[(zsOrigIdx + i) % 8];
      const dstP = RING_ORDER[(zsDstIdx + i) % 8];
      palaces[dstP].door = PALACE_META[srcP].door;
    }

    // 5. 八神旋转（阳顺阴逆）
    for (let i = 0; i < 8; i++) {
      const dstP = isYang
        ? RING_ORDER[(zfDstIdx + i) % 8]
        : RING_ORDER[(zfDstIdx - i + 8) % 8];
      palaces[dstP].god = GODS_FULL[i];
      palaces[dstP].godShort = GODS_SHORT[i];
    }

    // 6. 定位日干宫、时干宫、三胜宫、五不击
    let dayPalace = 2, hourPalace = zfTargetPalace, jiuTianPalace = 2, jiuDiPalace = 2, shengPalace = 2, dingPalace = 2;
    const dayTargetStem = (dGan === '甲') ? XUN_HEAD_STEM[LunarUtil.getXun(dGan + dZhi)] : dGan;
    RING_ORDER.forEach(p => {
      const pd = palaces[p];
      if (pd.heavenStem === dayTargetStem || pd.heavenJiStem === dayTargetStem) dayPalace = p;
      if (pd.god === '九天') jiuTianPalace = p;
      if (pd.god === '九地') jiuDiPalace = p;
      if (pd.door === '生门') shengPalace = p;
      if (pd.heavenStem === '丁' || pd.heavenJiStem === '丁') dingPalace = p;
    });

    const sanShengSet = new Set([zfTargetPalace, jiuTianPalace, shengPalace]);
    const wuBuJiExtra = (wuBuJiMode === 'dingqi') ? dingPalace : zsTargetPalace;
    const wuBuJiSet = new Set([...sanShengSet, jiuDiPalace, wuBuJiExtra]);

    const wuBuYuShi = (OVERCOMES[hGan] === dGan);
    const globalAuspicious = [];

    // 7. 逐宫扫描迫/刑/墓/空、吉凶格、Level 1-4 出行评级
    RING_ORDER.forEach(p => {
      const pd = palaces[p];
      pd.isSanSheng = sanShengSet.has(p);
      pd.isWuBuJi = wuBuJiSet.has(p);

      // 门迫
      if (ELEM_KE[DOOR_ELEM[pd.door]] === pd.elem) pd.marks.push('迫');
      // 击刑
      if (JIXING_MAP[pd.heavenStem] === p || (pd.heavenJiStem && JIXING_MAP[pd.heavenJiStem] === p)) pd.marks.push('刑');
      // 入墓
      if ((RUME_MAP[pd.heavenStem] && RUME_MAP[pd.heavenStem].includes(p)) ||
          (pd.heavenJiStem && RUME_MAP[pd.heavenJiStem] && RUME_MAP[pd.heavenJiStem].includes(p))) pd.marks.push('墓');
      // 空亡
      if (pd.isKong) pd.marks.push('空');

      const hS = pd.heavenStem, eS = pd.earthStem, door = pd.door, godS = pd.godShort;

      // 凶格扫描（参考 daily_qimen.txt）
      const bad = [];
      if (hS === '乙' && eS === '辛') bad.push('青龙逃走');
      if (hS === '辛' && eS === '乙') bad.push('白虎猖狂');

      if (hS === '丁' && eS === '癸') bad.push('朱雀投江');
      if (hS === '癸' && eS === hGan) bad.push('天罗');
      if (hS === '壬' && eS === hGan) bad.push('地网');
      if (hS === '庚' && eS === '丙') bad.push('太白入荧');
      if (hS === '丙' && eS === '庚') bad.push('荧入太白');
      if (hS === '丙' && [yGan,mGan,dGan,hGan].includes(eS)) bad.push('悖格');
      if (hS === '庚' && eS === '癸') bad.push('大格');
      if (hS === '庚' && eS === '己') bad.push('刑格');
      if (hS === '庚' && eS === '壬') bad.push('上格');
      if (hS === '庚' && [yGan,mGan,dGan,hGan].includes(eS)) bad.push('庚临四柱');
      if (hS === eS) bad.push('干伏吟');
      if ((hS==='丙'&&eS==='壬')||(hS==='壬'&&eS==='丙')) bad.push('火入天罗');
      pd.badForms = [...new Set(bad)];

      // 吉格扫描（参考 daily_qimen.txt + 奇门九遁）
      const good = [];
      if (hS === '戊' && eS === '丙') good.push('青龙返首');
      if (hS === '丙' && eS === '戊') good.push('飞鸟跌穴');
      if (godS === '符' && ['乙','丙','丁'].includes(eS)) good.push('相佐');
      if ((p === zsTargetPalace || door === zhiShiDoor) && (eS === '丁' || hS === '丁')) good.push('玉女守门');
      if (hS === '丙' && eS === '丁' && ['开门','休门','生门'].includes(door)) good.push('天遁');
      if (hS === '乙' && eS === '己' && ['开门','生门'].includes(door)) good.push('地遁');
      if (hS === '丁' && door === '休门' && godS === '阴') good.push('人遁');
      if (hS === '丙' && door === '生门' && godS === '天') good.push('神遁');
      if (hS === '丁' && door === '杜门' && godS === '地') good.push('鬼遁');
      if (['乙','丙','丁'].includes(hS) && ['开门','休门','生门'].includes(door) && p === 4) good.push('风遁');
      if (hS === '乙' && ['开门','休门','生门'].includes(door) && eS === '辛') good.push('云遁');
      if (hS === '乙' && ['开门','休门','生门'].includes(door) && p === 1) good.push('龙遁');
      if (hS === '乙' && door === '开门' && eS === '辛' && p === 8) good.push('虎遁');
      if (['乙','丙','丁'].includes(hS) && ['己','庚','辛','壬','癸'].includes(eS) && p === zsTargetPalace) good.push('三奇得使');
      if ((hS==='乙'&&p===3)||(hS==='丙'&&p===9)||(hS==='丁'&&p===7)) good.push('三奇升殿');
      if (['乙','丙','丁'].includes(hS) && ['开门','休门','生门'].includes(door) && ['阴','合','地'].includes(godS)) good.push('三诈');
      if (hS === '丙' && eS === '乙') good.push('日月并行');
      if (hS === '乙' && eS === '丙') good.push('奇仪顺遂');
      if (hS === '乙' && eS === '丁') good.push('奇仪相佐');
      if (hS === '丁' && eS === '乙') good.push('玉女奇生');
      if (hS === '戊' && eS === '丁') good.push('青龙耀明');
      if (hS === '丁' && eS === '戊') good.push('青龙转光');
      if (hS === '丙' && eS === '辛') good.push('日月相会');
      if (hS === '壬' && eS === '戊') good.push('小蛇化龙');
      pd.goodForms = [...new Set(good)];

      pd.goodForms.forEach(g => globalAuspicious.push({ name: g, palace: p, dir: pd.dir, gua: pd.gua, door: pd.door }));

      // 出行诀分级评估（保留全8宫展示，严苛净界高分，瑕疵降级标黄/红）
      const isGoodDoor = ['开门','休门','生门'].includes(door);
      const isJingDoor = (door === '景门');
      const hasDefect = pd.marks.length > 0 || pd.badForms.length > 0;
      const reasons = [];

      if (isGoodDoor && !hasDefect) {
        let lvl = 1;
        reasons.push(`纯净吉门(${door})`);
        if (['乙','丙','丁'].includes(hS)) { lvl = 2; reasons.push(`得三奇(${hS})`); }
        let hasL3 = false;
        if (['符','阴','地','天'].includes(godS)) { hasL3 = true; reasons.push(`吉神(${pd.god})`); }
        if (pd.goodForms.length > 0) { hasL3 = true; reasons.push(`吉格(${pd.goodForms.slice(0,2).join('、')})`); }
        if (hasL3) lvl = 3;

        const elemA = pd.elem, elemDay = PALACE_META[dayPalace].elem;
        const elemHr = PALACE_META[hourPalace].elem;
        const prodOrSame = (a, b) => a === b || PRODUCES[a] === b;
        if (prodOrSame(elemA, elemDay) || prodOrSame(elemHr, elemDay)) {
          lvl = 4;
          reasons.push('宫/时生助日干');
        }
        const names = {1:'L1 净界', 2:'L2 奇域', 3:'L3 神庇', 4:'L4 聚气'};
        const colors = {1:'#84cc16', 2:'#60a5fa', 3:'#22d3ee', 4:'#10b981'};
        pd.eval = { tier: lvl, label: names[lvl], short: `L${lvl}`, color: colors[lvl], status:'good', reasons };
      } else if ((isGoodDoor || isJingDoor) && !pd.badForms.length && pd.marks.length <= 1) {
        if (isJingDoor) reasons.push('景门(利文书展示)');
        else reasons.push(`${door}带瑕疵`);
        if (pd.marks.length) reasons.push(`注意:${pd.marks.join('/')}`);
        if (pd.goodForms.length) reasons.push(`吉格(${pd.goodForms[0]})`);
        pd.eval = { tier: 0.5, label: isJingDoor ? '景门·平吉' : '吉门带瑕', short: isJingDoor ? '景平' : '慎用', color: '#f59e0b', status:'warn', reasons };
      } else {
        if (!isGoodDoor && !isJingDoor) reasons.push(`凶/阻门(${door})`);
        if (pd.marks.length) reasons.push(`状态:${pd.marks.join('/')}`);
        if (pd.badForms.length) reasons.push(`凶格:${pd.badForms.slice(0,2).join('、')}`);
        pd.eval = { tier: 0, label: '避忌方位', short: '避忌', color: '#ef4444', status:'bad', reasons };
      }
    });

    // 选出本盘推荐出行排序
    const ranking = RING_ORDER.map(p => palaces[p]).sort((a, b) => {
      if (b.eval.tier !== a.eval.tier) return b.eval.tier - a.eval.tier;
      return b.eval.reasons.length - a.eval.reasons.length;
    });

    return {
      dateObj: new Date(dateObj.getTime()),
      method,
      wuBuJiMode,
      bazi: { y: yGan+yZhi, m: mGan+mZhi, d: dGan+dZhi, h: hGan+hZhi, yGan, mGan, dGan, hGan, hZhi },
      juInfo,
      xunHeadGZ, xunShouStem, xunKongStr, xunKongZhis,
      maZhi, maPalace,
      zhiFuStar, zhiFuPalace: zfTargetPalace,
      zhiShiDoor, zhiShiPalace: zsTargetPalace,
      wuBuYuShi,
      earthCenterStem: earthStem[5],
      palaces,
      ranking,
      globalAuspicious
    };
  }
};

/* ============================================================================
 * 四、应用状态 & 3D 零漂移罗盘传感器引擎
 * ============================================================================ */
const state = {
  date: new Date(),
  method: 'ChaiBu',
  wuBuJiMode: 'zhishi',
  labelMode: 'geju', // 'geju' | 'action'
  tilt3D: false,
  rings: { ring1:true, ring2:true, ring3:true, ring4:true, ring5:true },
  heading: 0,
  targetHeading: 0,
  sensorActive: false,
  cameraActive: false,
  stream: null,
  chart: null
};

function normDeg(d) { return ((d % 360) + 360) % 360; }

function getDirLookup(deg) {
  const d = normDeg(deg);
  // 8 宫 (每宫45°, 坎 337.5..22.5)
  const pIdx = Math.floor(((d + 22.5) % 360) / 45);
  const palaceNum = RING_ORDER[pIdx];
  // 12 地支 (每支30°, 子 345..15)
  const zIdx = Math.floor(((d + 15) % 360) / 30);
  const zhiObj = ZHI_12[zIdx];
  // 24 山 (每山15°, 子 352.5..7.5)
  const sIdx = Math.floor(((d + 7.5) % 360) / 15);
  const shanObj = SHAN_24[sIdx];
  // 检测是否落入八卦大空亡界线 (±1.5°)
  const nearBoundary = GUA_BOUNDARIES.some(b => {
    const diff = Math.abs(((d - b + 540) % 360) - 180);
    return diff <= 1.5;
  });
  return { deg: d, palaceNum, zhiObj, shanObj, nearBoundary };
}

// 3D ENU 融合解算：平放看屏幕顶(+Y)，竖举看后置摄像头(-Z)，任意俯仰角零翻转
function compute3DHeading(alpha, beta, gamma) {
  const deg2rad = Math.PI / 180;
  const a = alpha * deg2rad;
  const b = beta * deg2rad;
  const g = gamma * deg2rad;

  const cA = Math.cos(a), sA = Math.sin(a);
  const cB = Math.cos(b), sB = Math.sin(b);
  const cG = Math.cos(g), sG = Math.sin(g);

  // Col 1 (+Y 屏幕顶) 的 ENU 水平投影
  const topE = -sA * cB;
  const topN =  cA * cB;

  // -Col 2 (-Z 后置镜头) 的 ENU 水平投影
  const camE = -(cA * sG + sA * sB * cG);
  const camN = -(sA * sG - cA * sB * cG);

  const wTop = Math.max(0, cB);
  const wCam = Math.max(0, sB);

  const E = wTop * topE + wCam * camE;
  const N = wTop * topN + wCam * camN;

  let hdg = Math.atan2(E, N) * (180 / Math.PI);
  return normDeg(hdg);
}

function handleOrientation(e) {
  if (!state.sensorActive) return;
  let hdg = null;
  if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
    hdg = normDeg(e.webkitCompassHeading);
  } else if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
    hdg = compute3DHeading(e.alpha, e.beta, e.gamma);
  }
  if (hdg !== null) state.targetHeading = hdg;
}

async function toggleSensorMode() {
  const btn = document.getElementById('btn-sensor');
  const lbl = document.getElementById('sensor-lbl');
  const simBar = document.getElementById('sim-bar');

  if (state.sensorActive) {
    state.sensorActive = false;
    window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
    window.removeEventListener('deviceorientation', handleOrientation, true);
    btn.classList.remove('active');
    lbl.textContent = '手动中';
    simBar.classList.add('show');
    return;
  }

  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') {
        alert('未获得罗盘传感器权限，已保留手动旋转模式。');
        simBar.classList.add('show');
        return;
      }
    }
    state.sensorActive = true;
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    btn.classList.add('active');
    lbl.textContent = '磁感开';
    simBar.classList.remove('show');
  } catch (err) {
    alert('当前环境不支持自动磁感罗盘，已开启手动模拟滑动。');
    simBar.classList.add('show');
  }
}

async function toggleCamera() {
  const video = document.getElementById('camera-video');
  const bgGrid = document.getElementById('bg-grid');
  const btn = document.getElementById('btn-camera');

  if (state.cameraActive) {
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
    state.cameraActive = false;
    video.classList.remove('active');
    bgGrid.classList.remove('ar-on');
    btn.classList.remove('active');
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('当前浏览器或非 HTTPS 环境无法调用后置摄像头。');
    return;
  }
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = state.stream;
    await video.play();
    state.cameraActive = true;
    video.classList.add('active');
    bgGrid.classList.add('ar-on');
    btn.classList.add('active');
  } catch (err) {
    alert('无法启动摄像头（请确认已授权且为 HTTPS 链接）：' + err.message);
  }
}

/* ============================================================================
 * 五、SVG 5-Ring 罗盘高清渲染引擎
 * ============================================================================ */
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs = {}, text = null) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== null) el.textContent = text;
  return el;
}
function polar(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function sectorPath(cx, cy, rIn, rOut, startDeg, endDeg) {
  const p1 = polar(cx, cy, rOut, startDeg);
  const p2 = polar(cx, cy, rOut, endDeg);
  const p3 = polar(cx, cy, rIn, endDeg);
  const p4 = polar(cx, cy, rIn, startDeg);
  const large = (endDeg - startDeg) > 180 ? 1 : 0;
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${rOut} ${rOut} 0 ${large} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)} A ${rIn} ${rIn} 0 ${large} 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)} Z`;
}
function radialText(cx, cy, r, deg, text, attrs = {}) {
  const pos = polar(cx, cy, r, deg);
  return svgEl('text', {
    x: pos.x.toFixed(2), y: pos.y.toFixed(2),
    'text-anchor': 'middle', 'dominant-baseline': 'central',
    transform: `rotate(${deg} ${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`,
    ...attrs
  }, text);
}

      // 中上：九星 + 天盘干

      grp.appendChild(radialText(cx, cy, 206, pd.center - 7, starTxt, {
        fill: '#93c5fd', 'font-size': 17, 'font-weight': '700'
      }));
      const hStemTxt = pd.heavenStem + (pd.heavenJiStem ? pd.heavenJiStem : '');
      grp.appendChild(radialText(cx, cy, 206, pd.center + 11, hStemTxt, {
        fill: ['乙','丙','丁'].includes(pd.heavenStem) ? '#34d399' : '#f8fafc',
        'font-size': 22, 'font-weight': '900'
      }));

      // 中下：八门 + 地盘干
      const doorColor = ['开门','休门','生门'].includes(pd.door) ? '#34d399' : (pd.door === '景门' ? '#fbbf24' : '#f87171');
      grp.appendChild(radialText(cx, cy, 166, pd.center - 7, pd.door, {
        fill: doorColor, 'font-size': 22, 'font-weight': '900'
      }));
      const eStemTxt = pd.earthStem + (pd.earthJiStem ? pd.earthJiStem : '');
      grp.appendChild(radialText(cx, cy, 166, pd.center + 11, eStemTxt, {
        fill: '#9ca3af', 'font-size': 19, 'font-weight': '700'
      }));

      // 内缘：宫位卦名 + 洛书数
      grp.appendChild(radialText(cx, cy, 128, pd.center, `${pd.gua}${pNum}`, {
        fill: 'rgba(226,190,103,0.85)', 'font-size': 16, 'font-weight': '800'
      }));

      g1.appendChild(grp);
    });
  }

  // --- 中五宫中心圆盘 (r: 0..108) ---
  const hub = document.getElementById('center-hub');
  hub.innerHTML = '';
  hub.appendChild(svgEl('circle', { cx, cy, r: 108, fill: 'url(#centerGlow)', stroke: '#e2be67', 'stroke-width': 2.5 }));
  hub.appendChild(svgEl('text', { x:cx, y:cy-30, 'text-anchor':'middle', fill:'#e2be67', 'font-size':22, 'font-weight':800 },
    `${chart.juInfo.isYang ? '阳遁' : '阴遁'}${chart.juInfo.juNumber}局`));
  hub.appendChild(svgEl('text', { x:cx, y:cy-4, 'text-anchor':'middle', fill:'#f3f4f6', 'font-size':17, 'font-weight':700 },
    `${chart.juInfo.jqName}·${chart.juInfo.yuanName}`));
  hub.appendChild(svgEl('text', { x:cx, y:cy+22, 'text-anchor':'middle', fill:'#93c5fd', 'font-size':16, 'font-weight':700 },
    `符:${chart.zhiFuStar} 使:${chart.zhiShiDoor}`));
  hub.appendChild(svgEl('text', { x:cx, y:cy+48, 'text-anchor':'middle', fill:'#9ca3af', 'font-size':15 },
    `中五寄干:${chart.earthCenterStem} 空:${chart.xunKongStr}`));
}

function updateMetaBar() {
  const c = state.chart;
  if (!c) return;
  const d = c.dateObj;
  const pad = n => (n < 10 ? '0' : '') + n;
  const timeStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const best = c.ranking[0];
  let html = `
    <span>${timeStr}</span>
    <span class="bazi">${c.bazi.y} ${c.bazi.m} ${c.bazi.d} ${c.bazi.h}</span>
    <span>${c.juInfo.isYang?'阳':'阴'}${c.juInfo.juNumber}局(${c.juInfo.jqName}${c.juInfo.isLeapTerm?'·闰':''})</span>
    <span style="color:#6ee7b7">首选:${best.dir}(${best.door}·${best.eval.short})</span>
  `;
  if (c.wuBuYuShi) {
    html += `<span class="tag-bad">⚠️ 五不遇时(${c.bazi.hGan}克${c.bazi.dGan})</span>`;
  }
  document.getElementById('meta-bar').innerHTML = html;
}

function updateHeadingHUD() {
  const info = getDirLookup(state.heading);
  document.getElementById('hud-deg').textContent = `${info.deg.toFixed(1).padStart(5, '0')}°`;
  const c = state.chart;
  if (!c) return;
  const pd = c.palaces[info.palaceNum];
  document.getElementById('hud-dir').textContent = `${pd.dir} · ${pd.gua}${pd.num}宫`;
  document.getElementById('hud-sub').textContent = `${info.shanObj.name}山(24山) · ${info.zhiObj.name}宫(12支)`;

  const ev = pd.eval;
  const intent = DOOR_INTENTS[pd.door];
  const extra = pd.goodForms[0] || (pd.marks.length ? '留意:' + pd.marks.join('/') : intent.title);
  document.getElementById('hud-eval').innerHTML = `
    <div><span class="level-badge" style="background:${ev.color}">${ev.label}</span> <strong style="color:#fff">${pd.door}</strong></div>
    <div style="color:#cbd5e1">${pd.god} · ${pd.star} · ${pd.heavenStem}/${pd.earthStem} · ${extra}</div>
  `;
  document.getElementById('crack-warn').classList.toggle('show', info.nearBoundary);
}

function animateLoop() {
  // 最短角插值平滑防抖
  const diff = ((state.targetHeading - state.heading + 540) % 360) - 180;
  if (Math.abs(diff) > 0.05) {
    state.heading = normDeg(state.heading + diff * 0.22);
    document.getElementById('wheel-group').setAttribute('transform', `rotate(${-state.heading.toFixed(2)} 500 500)`);
    updateHeadingHUD();
  }
  requestAnimationFrame(animateLoop);
}

function recomputeAndRender() {
  if (typeof Solar === 'undefined') return;
  state.chart = QimenEngine.generate(state.date, state.method, state.wuBuJiMode);
  renderCompassSVG();
  updateMetaBar();
  updateHeadingHUD();
}

        </div>
        <button class="btn-full" onclick="runReverseSearch()">🔍 扫描未来 7 天最近 5 个吉时</button>

function runReverseSearch() {
  const targetP = parseInt(document.getElementById('rev-palace').value, 10);
  const doorFilter = document.getElementById('rev-door').value;
  const strict = document.getElementById('rev-strict').value === 'strict';
  const results = [];

  // 从当前时间往后逐时辰（+2小时）扫描 84 个时辰（7天）
  let scan = new Date(state.date.getTime());
  // 对齐到当前时辰中点（偶点数 0,2,4..22）
  const curH = scan.getHours();
  const alignedH = curH === 23 ? 23 : (curH % 2 === 1 ? curH + 1 : curH);
  scan.setHours(alignedH, 0, 0, 0);

  for (let i = 0; i < 84 && results.length < 5; i++) {
    const t = new Date(scan.getTime() + i * 2 * 3600 * 1000);
    const ch = QimenEngine.generate(t, state.method, state.wuBuJiMode);
    if (ch.wuBuYuShi) continue;
    const pd = ch.palaces[targetP];

    if (doorFilter === 'any') {
      if (!['开门','休门','生门'].includes(pd.door)) continue;
    } else if (pd.door !== doorFilter) {
      continue;
    }

    if (strict && pd.eval.tier < 1) continue;
    if (!strict && pd.eval.tier < 0.5) continue;

    results.push({ time: t, chart: ch, pd });
  }

  const box = document.getElementById('rev-results');
  if (!results.length) {
    box.innerHTML = `<div class="card warn">未来 7 天内未找到满足该严苛条件的时段，可尝试切换为「宽松模式」或放宽吉门限制。</div>`;
    return;
  }

  const pad = n => (n < 10 ? '0' : '') + n;
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  box.innerHTML = results.map((r, idx) => {
    const d = r.time;
    const h = d.getHours();
    const startH = h === 0 ? 23 : (h % 2 === 0 ? h - 1 : h);
    const endH = (startH + 2) % 24;
    const labelTime = `${d.getMonth()+1}月${d.getDate()}日(${weekdays[d.getDay()]}) ${r.chart.bazi.hZhi}时 (${pad(startH)}:00-${pad(endH)}:00)`;
    return `
      <div class="card ${r.pd.eval.status}">
        <div class="card-title">
          <span>#${idx+1} ${labelTime}</span>
          <span class="level-badge" style="background:${r.pd.eval.color}">${r.pd.eval.label}</span>
        </div>
        <div style="font-size:12px;color:#d1d5db">
          ${r.pd.dir} · ${r.pd.door} · ${r.pd.god} · ${r.pd.star} · ${r.pd.heavenStem}/${r.pd.earthStem}
          ${r.pd.goodForms.length ? '<br>吉格：' + r.pd.goodForms.join('、') : ''}
        </div>
        <button style="margin-top:8px;padding:5px 10px;border-radius:6px;border:1px solid var(--gold);background:rgba(226,190,103,0.16);color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;"
          onclick="jumpToTime(${d.getTime()}, ${targetP})">🎯 切到此吉时并在罗盘指向${r.pd.dir}</button>
      </div>
    `;
  }).join('');
}

function jumpToTime(ts, targetP) {
  state.date = new Date(ts);

/* ============================================================================
 * 八、手势拖拽旋转 & 事件绑定初始化
 * ============================================================================ */
function initInteractions() {
  // 流派切换
  document.querySelectorAll('#method-seg button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#method-seg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.method = btn.dataset.m;
      recomputeAndRender();
    };
  });

  // 5 环独立开关
  document.querySelectorAll('#ring-toggles .chip[data-ring]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.ring;
      state.rings[k] = !state.rings[k];
      btn.classList.toggle('on', state.rings[k]);
      renderCompassSVG();
    };
  });

  // 手动滑块
  const slider = document.getElementById('sim-slider');
  const simVal = document.getElementById('sim-val');
  slider.oninput = () => {
    if (state.sensorActive) toggleSensorMode();
    state.targetHeading = parseFloat(slider.value);
    simVal.textContent = `${state.targetHeading.toFixed(1)}°`;
  };

  // 罗盘舞台触摸/鼠标旋转（手动模拟模式下）
  const stage = document.getElementById('compass-stage');
  let dragging = false, startAngle = 0, startHeading = 0;
  function getPointerAngle(e) {
    const rect = stage.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const pt = e.touches ? e.touches[0] : e;
    return Math.atan2(pt.clientY - cy, pt.clientX - cx) * (180 / Math.PI);
  }
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.palace-hit') && state.sensorActive) return;
    if (state.sensorActive) return;
    dragging = true;
    startAngle = getPointerAngle(e);
    startHeading = state.targetHeading;
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const cur = getPointerAngle(e);
    const delta = cur - startAngle;
    state.targetHeading = normDeg(startHeading - delta);
    slider.value = state.targetHeading;
    simVal.textContent = `${state.targetHeading.toFixed(1)}°`;
  });
  window.addEventListener('pointerup', () => { dragging = false; });

  // 非 HTTPS 提醒 & 默认展开模拟条
  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure) {
    document.getElementById('https-banner').classList.add('show');
  }
  document.getElementById('sim-bar').classList.add('show');
}

window.__onLunarReady = function() {
  recomputeAndRender();
};

window.addEventListener('DOMContentLoaded', () => {
  initInteractions();
  if (typeof Solar !== 'undefined') recomputeAndRender();
  requestAnimationFrame(animateLoop);
});
</script>
</body>
</html>
